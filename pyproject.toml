[project]
name = "sandbagging-workshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Katherine Rosenfeld", email = "krosenf@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "a2a-sdk[http-server]>=0.3.22",
    "alive-progress>=3.3.0",
    "anthropic>=0.76.0",
    "claude-agent-sdk>=0.1.36",
    "click>=8.2.1",
    "hydra-core>=1.3.2",
    "inspect-ai>=0.3.165",
    "openai>=2.16.0",
    "pandas>=3.0.0",
    "polars>=1.37.1",
    "pyarrow>=23.0.0",
    "pytest[dev]>=9.0.2",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.8.0",
]

[project.scripts]
sandbagging-workshop = "sandbagging_workshop:main"
start-claude-code-server = "sandbagging_workshop.claude_code_server:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
